[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sm-airlock"
version = "0.2.0"
description = "Attribute-level capability restriction for agent plugins in decentralized AI agent networks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "StellarMinds", email = "hello@stellarminds.ai" }]
keywords = ["nanda", "agent", "sandbox", "plugin", "security", "airlock"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0", "mypy>=1.0", "coverage>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["sm_airlock"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
